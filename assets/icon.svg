<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0EAFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Subtle circles -->
  <circle cx="820" cy="200" r="180" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="180" cy="850" r="150" fill="#FFFFFF" opacity="0.06"/>

  <!-- Wrench + Screwdriver crossed (support tools) -->
  <g transform="translate(512,512)">
    <!-- Outer ring -->
    <circle r="300" fill="#FFFFFF" opacity="0.12"/>
    <circle r="300" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.25"/>

    <!-- Gear teeth ring -->
    <g fill="#FFFFFF" opacity="0.9">
      <g transform="rotate(0)">
        <rect x="-26" y="-268" width="52" height="60" rx="12"/>
      </g>
      <g transform="rotate(45)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
      <g transform="rotate(90)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
      <g transform="rotate(135)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
      <g transform="rotate(180)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
      <g transform="rotate(225)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
      <g transform="rotate(270)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
      <g transform="rotate(315)"><rect x="-26" y="-268" width="52" height="60" rx="12"/></g>
    </g>

    <!-- Central rounded square -->
    <rect x="-170" y="-170" width="340" height="340" rx="80" fill="url(#badge)"/>

    <!-- Wrench icon (simplified) -->
    <g transform="rotate(-45)">
      <!-- handle -->
      <rect x="-24" y="-40" width="48" height="180" rx="24" fill="#1D4ED8"/>
      <!-- head -->
      <path d="M -60 -120
               a 60 60 0 1 0 120 0
               a 60 60 0 0 1 -120 0 Z"
            fill="#1D4ED8"/>
      <circle cx="0" cy="-120" r="30" fill="url(#badge)"/>
      <rect x="-30" y="-160" width="60" height="40" fill="url(#badge)"/>
    </g>

    <!-- Headset arc for "support" hint -->
    <path d="M -110 30 A 110 110 0 0 1 110 30"
          fill="none" stroke="#3B82F6" stroke-width="22" stroke-linecap="round"/>
    <rect x="-135" y="25" width="46" height="70" rx="20" fill="#3B82F6"/>
    <rect x="89" y="25" width="46" height="70" rx="20" fill="#3B82F6"/>
  </g>
</svg>
